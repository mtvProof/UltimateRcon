services:
  ultimate-rcon:
    build: .
    container_name: ultimate-rcon
    restart: unless-stopped
    environment:
      # Enable environment-only mode (no config JSON files needed)
      - UR_ENV_ONLY=true
    volumes:
      - ${DATABASE_DIR:-./data/database}:/data/database
      - ${IMAGESTORE_DIR:-./data/imagestorage}:/data/imagestorage
